name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: 24
            shell: default
          - os: ubuntu-24.04
            node: 22
            shell: node22
          - os: macos-15
            node: 24
            shell: default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@4b040423529d49b1a19ba918742e0aa9aa95031a # v3
      - uses: DeterminateSystems/flakehub-cache-action@599f4b231216aed692532bc717021b9b0aafb35d # v3
      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shell }}-${{ hashFiles('package-lock.json') }}
      - name: Install locked dependencies
        run: nix develop ".#${SHELL_NAME}" --command just install
        env:
          SHELL_NAME: ${{ matrix.shell }}
      - name: Lint PR commits
        if: github.event_name == 'pull_request'
        run: |
          nix develop ".#${SHELL_NAME}" --command jj git init --colocate
          nix develop ".#${SHELL_NAME}" --command shaka commit lint -r "$BASE..$HEAD"
        env:
          SHELL_NAME: ${{ matrix.shell }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
      - name: Validate and assemble the package
        run: nix develop ".#${SHELL_NAME}" --command just validate
        env:
          SHELL_NAME: ${{ matrix.shell }}
      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.shell }}
          path: |
            coverage/
            !coverage/tmp/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-${{ matrix.os }}-${{ matrix.shell }}
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  gate:
    name: Gate
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation lane
        run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.validate.result }}
